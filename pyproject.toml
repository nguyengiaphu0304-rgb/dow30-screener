[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dow30-screener"
version = "0.2.0"
description = "A provenance-aware educational equity research toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Nguyen Gia Phu" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
legacy = [
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "sqlalchemy>=2,<3",
  "yfinance>=0.2.54,<2",
]
dev = [
  "build>=1.2,<2",
  "mypy>=1.15,<2",
  "pip-audit>=2.8,<3",
  "pytest>=9.0.3,<10",
  "ruff>=0.11,<1",
]

[project.urls]
Homepage = "https://github.com/nguyengiaphu0304-rgb/dow30-screener"
Repository = "https://github.com/nguyengiaphu0304-rgb/dow30-screener.git"
Issues = "https://github.com/nguyengiaphu0304-rgb/dow30-screener/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["dow30_screener"]
